name: Durable nightly Shopify and feed cycle

on:
  schedule:
    - cron: "0 2 2-30/2 * *"

  workflow_dispatch:
    inputs:
      cycle_key:
        description: "Nightly cycle key YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: durable-nightly-feed-cycle
  cancel-in-progress: false

jobs:
  nightly-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      NIGHTLY_CYCLE_URL: ${{ vars.NIGHTLY_CYCLE_URL }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      MANUAL_CYCLE_KEY: ${{ inputs.cycle_key }}

    steps:
      - name: Advance durable cycle sequentially
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_CYCLE_KEY:-}" ]; then
            cycle_key="$MANUAL_CYCLE_KEY"
          else
            cycle_key="$(date -u +%F)"
          fi

          if ! [[ "$cycle_key" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid cycle key: $cycle_key"
            exit 1
          fi

          echo "Starting durable nightly cycle: $cycle_key"

          deadline=$(( $(date +%s) + 10740 ))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            body_file="$(mktemp)"

            set +e
            http_code="$(
              curl \
                --silent \
                --show-error \
                --max-time 70 \
                --connect-timeout 15 \
                --output "$body_file" \
                --write-out "%{http_code}" \
                --request POST \
                --header "Authorization: Bearer ${INTERNAL_API_SECRET}" \
                --header "Content-Type: application/json" \
                --data "{\"cycleKey\":\"${cycle_key}\"}" \
                "${NIGHTLY_CYCLE_URL}"
            )"
            curl_exit=$?
            set -e

            if [ "$curl_exit" -ne 0 ]; then
              echo "Transient network/curl error (exit=$curl_exit). Retrying in 10s."
              rm -f "$body_file"
              sleep 10
              continue
            fi

            case "$http_code" in
              500|502|503|504)
                echo "Transient HTTP $http_code. Retrying in 10s."
                echo "Response:"
                cat "$body_file" || true
                rm -f "$body_file"
                sleep 10
                continue
                ;;
            esac

            if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "Non-retryable HTTP error: $http_code"
              echo "Response:"
              cat "$body_file" || true
              rm -f "$body_file"
              exit 1
            fi

            if ! jq -e . "$body_file" >/dev/null 2>&1; then
              echo "Received a non-JSON 2xx response. Retrying in 10s."
              echo "Response:"
              cat "$body_file" || true
              rm -f "$body_file"
              sleep 10
              continue
            fi

            status="$(jq -r '.status // empty' "$body_file")"
            phase="$(jq -r '.phase // empty' "$body_file")"

            echo "Nightly cycle status=${status:-unknown} phase=${phase:-unknown}"

            case "$status" in
              completed)
                echo "Durable nightly cycle completed successfully."
                rm -f "$body_file"
                exit 0
                ;;

              failed)
                echo "Durable nightly cycle reported failure:"
                cat "$body_file"
                rm -f "$body_file"
                exit 1
                ;;

              running)
                rm -f "$body_file"
                sleep 1
                ;;

              idle)
                rm -f "$body_file"
                sleep 10
                ;;

              *)
                echo "Unexpected cycle status: ${status:-missing}"
                cat "$body_file"
                rm -f "$body_file"
                exit 1
                ;;
            esac
          done

          echo "Nightly cycle watchdog reached 179 minutes."
          exit 1
