name: Durable nightly Shopify and feed cycle

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      cycle_key:
        description: "UTC cycle key (YYYY-MM-DD); defaults to today"
        required: false
        type: string

concurrency:
  group: durable-nightly-feed-cycle
  cancel-in-progress: false

jobs:
  nightly-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Advance durable cycle sequentially
        env:
          NIGHTLY_CYCLE_URL: ${{ vars.NIGHTLY_CYCLE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          REQUESTED_CYCLE_KEY: ${{ inputs.cycle_key }}
        run: |
          bash .github/scripts/run-nightly-cycle.sh