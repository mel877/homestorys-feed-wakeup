name: Durable nightly Shopify and feed cycle

on:
  schedule:
    - cron: "0 2 2-30/2 * *"

  workflow_dispatch:
    inputs:
      cycle_key:
        description: "Nightly cycle key YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: durable-nightly-feed-cycle
  cancel-in-progress: false

jobs:
  nightly-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      NIGHTLY_CYCLE_URL: ${{ vars.NIGHTLY_CYCLE_URL }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Advance durable cycle sequentially
        env:
          REQUESTED_CYCLE_KEY: ${{ inputs.cycle_key }}
          NIGHTLY_WATCHDOG_SECONDS: "17400"
        run: bash .github/scripts/run-nightly-cycle.sh
