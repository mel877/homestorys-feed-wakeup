classes:
  standard:
    label: Standard Delivery
    description: Standard home delivery for small to medium items

  bulky:
    label: Bulky / Large Furniture
    description: Dedicated delivery for oversized furniture items

  premium_delivery:
    label: Premium Delivery & Assembly
    description: White-glove delivery with in-home assembly

  made_to_order:
    label: Made to Order
    description: Custom items — delivery timeline communicated separately

  pickup_only:
    label: Showroom Pickup Only
    description: Available for pickup at Eupen showroom only

# Per-market rates — intentionally empty; do not invent rates.
# Populate from actual business rules provided in /input/shipping/
# and configure in Google Merchant Center account-level shipping settings.
rates: {}

# Google and Meta catalog feeds: product-level shipping tiers per country.
# Key = ISO country code matching config/markets.yaml (BE, FR, DE, AT, CH, LU).
# Format emitted in the Meta CSV: "country::service:price currency"
#
# Source: Channable Projet DE for BE/DE/AT/LU/CH (confirmed 2026-08-18 by Mélissa).
#         Channable Projet FR for FR (confirmed 2026-08-18 by Mélissa).
meta_feed_rates:
  BE:
    service: "Livraison Standard"
    currency: "EUR"
    tiers:
      - minimum_order_value: 0
        price: "9.50"
      - minimum_order_value: 250
        price: "0"
  DE:
    service: "Standardlieferung"
    currency: "EUR"
    tiers:
      - minimum_order_value: 0
        price: "9.50"
      - minimum_order_value: 250
        price: "0"
  AT:
    service: "Standardlieferung"
    currency: "EUR"
    tiers:
      - minimum_order_value: 0
        price: "19.50"
      - minimum_order_value: 500
        price: "0"
  LU:
    service: "Livraison Standard"
    currency: "EUR"
    tiers:
      - minimum_order_value: 0
        price: "9.50"
      - minimum_order_value: 250
        price: "0"
  CH:
    service: "Standardlieferung"
    currency: "CHF"
    tiers:
      - minimum_order_value: 0
        price: "19.50"
      - minimum_order_value: 500
        price: "0"
  FR:
    service: "Livraison Standard"
    currency: "EUR"
    tiers:
      - minimum_order_value: 0
        price: "9.50"
      - minimum_order_value: 250
        price: "0"

# Default class when no metafield is present and no rule matches
default_class: standard
