classes:
  standard:
    label: Standard Delivery
    description: Standard home delivery for small to medium items

  bulky:
    label: Bulky / Large Furniture
    description: Dedicated delivery for oversized furniture items

  premium_delivery:
    label: Premium Delivery & Assembly
    description: White-glove delivery with in-home assembly

  made_to_order:
    label: Made to Order
    description: Custom items — delivery timeline communicated separately

  pickup_only:
    label: Showroom Pickup Only
    description: Available for pickup at Eupen showroom only

# Per-market rates — intentionally empty; do not invent rates.
# Populate from actual business rules provided in /input/shipping/
# and configure in Google Merchant Center account-level shipping settings.
rates: {}

# Meta catalog feed: flat shipping rate per country (Fix 9).
# Key = ISO country code matching config/markets.yaml (BE, FR, DE, AT, CH, LU).
# Format emitted in the Meta CSV: "country::service:price currency"
#
# Source: Channable Projet DE (confirmed 2026-08-18 by Mélissa).
# Note: Channable has tiered rates (e.g. < 250€ → 9.60€, ≥ 250€ → free).
# Meta catalog only supports one flat rate per country, so the non-zero tier is
# used here as a conservative estimate. Orders above the free-shipping threshold
# will show free shipping at checkout regardless of what appears in the feed.
# For FR: rates are in the separate Channable Projet FR — configure when available.
meta_feed_rates:
  BE:
    service: "Livraison Standard"
    price: "9.60"
    currency: "EUR"
  DE:
    service: "Standardlieferung"
    price: "9.50"
    currency: "EUR"
  AT:
    service: "Standardlieferung"
    price: "19.50"
    currency: "EUR"
  LU:
    service: "Livraison Standard"
    price: "9.50"
    currency: "EUR"
  CH:
    service: "Standardlieferung"
    price: "19.50"
    currency: "CHF"
  FR:
    service: "Livraison Standard"
    price: "9.50"
    currency: "EUR"
    # Source: Channable Projet FR — Facebook Dynamic Ads rules "Versandkosten unter/über 250"
    # Tiered: < 250€ → 9.50€ / ≥ 250€ → free. Flat rate = 9.50€ (conservative estimate).

# Default class when no metafield is present and no rule matches
default_class: standard
